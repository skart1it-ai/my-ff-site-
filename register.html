<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Register - MySite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">MySite</div>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html" class="active">Register</a>
      <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
      <a href="#" id="logoutLink" style="display:none;" onclick="logout()">Logout</a>
    </div>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
  </nav>

  <main class="container">
    <div class="form-card">
      <h2>Create Account</h2>
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regUsername">Username</label>
          <input type="text" id="regUsername" required placeholder="Choose a username" autocomplete="username" minlength="3">
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" required placeholder="Enter your email" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required placeholder="Create a password" autocomplete="new-password" minlength="4">
        </div>
        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <input type="password" id="regConfirm" required placeholder="Confirm password" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Register</button>
      </form>
      <p class="form-footer">Already have an account? <a href="login.html">Login here</a></p>
      <div id="registerMessage" class="message"></div>
    </div>
  </main>

  <footer>
    <p>Hosted on GitHub Pages • Mobile friendly</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
